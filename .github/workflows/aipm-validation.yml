name: AIPM validation

on:
  push:
    branches: [aipm]
  pull_request:
    branches: [aipm]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aipm-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Check application privacy and repository isolation
        run: >-
          pnpm exec vitest run
          packages/bundle/base/tests/base.spec.ts
          packages/bundle/sdk-minimal/tests/sdk-minimal.spec.ts
          packages/bundle/web-app/tests/product-analytics.spec.ts
          apps/cli/tests/telemetry-switch.spec.ts
          scripts/public-release-policy.spec.ts
          --maxWorkers=2
      - run: pnpm run test:docs

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan current files and incoming commit history
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir . --config .gitleaks.toml --redact=100 --no-banner
          if [[ "$SCAN_BASE" =~ ^[0-9a-f]{40}$ && "$SCAN_BASE" != 0000000000000000000000000000000000000000 && "$SCAN_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --config .gitleaks.toml --log-opts="$SCAN_BASE..$SCAN_HEAD" --redact=100 --no-banner
          fi
