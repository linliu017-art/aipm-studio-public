<script src="https://cdn.jsdelivr.net/npm/markdown-it-container@4/dist/markdown-it-container.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>

<style>
:root{
  color-scheme:light;
  --color-white:#ffffff;
  --color-gray-50:#fafafa;
  --color-gray-100:#f8f8f8;
  --color-gray-150:#f0f0f0;
  --color-gray-200:#eeeeee;
  --color-gray-300:#d1d5db;
  --color-gray-450:#767676;
  --color-gray-600:#666666;
  --color-gray-700:#171717;
  --color-gray-900:#1a1d2e;
  --color-black-soft:#191919;
  --color-red-50:#fff5f4;
  --color-red-700:#b42318;
  --color-amber-50:#fffbeb;
  --color-amber-800:#854d0e;
  --report-bg:var(--color-white);
  --report-surface:var(--color-gray-100);
  --report-ink:var(--color-gray-700);
  --report-ink-strong:var(--color-black-soft);
  --report-ink-muted:var(--color-gray-600);
  --report-ink-subtle:var(--color-gray-450);
  --report-border:var(--color-gray-200);
  --report-divider:var(--color-gray-150);
  --report-border-strong:var(--color-gray-300);
  --report-accent:var(--color-black-soft);
  --report-risk:var(--color-red-700);
  --report-risk-soft:var(--color-red-50);
  --report-attention:var(--color-amber-800);
  --report-attention-soft:var(--color-amber-50);
  --radius-6:6px;
  --radius-8:8px;
  --radius-12:12px;
  --radius-16:16px;
  --radius-pill:9999px;
  --font-app:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',system-ui,'Segoe UI','Microsoft YaHei',sans-serif;
  --font-mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--report-bg)}
body{margin:0;min-height:100vh;background:var(--report-bg);color:var(--report-ink);font-family:var(--font-app);font-size:16px;line-height:1.68;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,a{font:inherit}
a{color:var(--report-accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{opacity:.75}
button:focus-visible,a:focus-visible{outline:2px solid var(--report-accent);outline-offset:2px}
.skip-link{position:fixed;left:16px;top:12px;z-index:1000;padding:10px 14px;border:1px solid var(--report-border-strong);border-radius:var(--radius-6);background:var(--report-bg);color:var(--report-ink-strong);transform:translateY(-160%)}
.skip-link:focus{transform:translateY(0)}
.report-layout{display:grid;grid-template-columns:232px minmax(0,900px);gap:48px;max-width:1244px;margin:0 auto;padding:32px 32px 96px}
.report-nav{position:sticky;top:24px;align-self:start;max-height:calc(100vh - 48px);overflow-y:auto;border:1px solid var(--report-border);border-radius:var(--radius-12);padding:20px 14px;background:var(--report-bg)}
.report-nav-brand{padding:0 10px 16px;border-bottom:1px solid var(--report-divider)}
.report-nav-kicker{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--report-ink-strong)}
.report-nav-meta{margin-top:6px;font-size:12px;color:var(--report-ink-subtle)}
.bm-toc-title{padding:20px 10px 8px;font-size:12px;font-weight:500;color:var(--report-ink-muted)}
.bm-toc .group-t{display:block;margin-top:16px;padding:0 10px 6px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--report-ink-strong)}
.bm-toc .group-t:first-child{margin-top:4px}
.bm-toc a{display:flex;align-items:flex-start;gap:8px;min-height:36px;padding:8px 10px;border-radius:var(--radius-6);color:var(--report-ink-muted);font-size:14px;line-height:1.4;text-decoration:none}
.bm-toc a:hover{background:var(--report-surface);color:var(--report-ink-strong);opacity:1}
.bm-toc a.active{background:var(--report-surface);color:var(--report-ink-strong);font-weight:500}
.bm-toc a .ord{width:22px;flex:0 0 22px;font-family:var(--font-mono);font-size:12px;color:var(--report-ink-subtle)}
.bm-toc a.sub{min-height:30px;padding:5px 10px 5px 40px;font-size:12px;color:var(--report-ink-subtle)}
.report-main{min-width:0}
.report-cover{padding:24px 0 32px;border-bottom:1px solid var(--report-divider)}
.report-kicker{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--report-ink-muted)}
.report-title{max-width:780px;margin:16px 0 10px;color:var(--report-ink-strong);font-size:32px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.report-subtitle{margin:0;color:var(--report-ink-muted);font-size:14px;line-height:1.5}
.report-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.report-tag{display:inline-flex;align-items:center;min-height:28px;padding:4px 8px;border-radius:var(--radius-6);background:var(--report-surface);color:var(--report-ink-muted);font-size:12px;line-height:1.2}
.metric-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:28px;border:1px solid var(--report-border);border-radius:var(--radius-12);overflow:hidden}
.metric-card{min-width:0;padding:18px;border-right:1px solid var(--report-divider);background:var(--report-bg)}
.metric-card:last-child{border-right:0}
.metric-label{font-size:12px;color:var(--report-ink-subtle)}
.metric-value{margin-top:7px;color:var(--report-ink-strong);font-size:20px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.metric-note{margin-top:4px;color:var(--report-ink-muted);font-size:12px;line-height:1.45}
.view-nav-wrap{padding:32px 0 8px}
.view-nav-heading{margin:0 0 6px;color:var(--report-ink-strong);font-size:20px;font-weight:500;line-height:1.3}
.view-nav-intro{max-width:720px;margin:0 0 16px;color:var(--report-ink-muted);font-size:14px}
.view-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.view-card{display:block;min-height:132px;padding:20px;border:1px solid var(--report-border);border-radius:var(--radius-12);background:var(--report-bg);color:inherit;text-decoration:none;transition:border-color 120ms ease,background 120ms ease}
.view-card:hover{border-color:var(--report-border-strong);background:var(--report-surface);opacity:1}
.view-index,.view-title,.view-desc{display:block}
.view-index{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--report-ink-subtle)}
.view-title{margin-top:16px;color:var(--report-ink-strong);font-size:20px;font-weight:500;line-height:1.3}
.view-desc{margin-top:6px;color:var(--report-ink-muted);font-size:14px;line-height:1.55}
.mobile-report-nav{display:none}
.report-toolbar{position:sticky;top:0;z-index:20;display:flex;justify-content:flex-end;gap:8px;padding:12px 0;border-bottom:1px solid var(--report-divider);background:var(--report-bg)}
.toolbar-btn{min-height:44px;padding:9px 14px;border:1px solid var(--report-border);border-radius:var(--radius-pill);background:var(--report-bg);color:var(--report-ink-muted);font-size:13px;cursor:pointer;transition:border-color 120ms ease,background 120ms ease,color 120ms ease}
.toolbar-btn:hover{border-color:var(--report-border-strong);background:var(--report-surface);color:var(--report-ink-strong)}
#content>h1{display:none}
.bm-ch{scroll-margin-top:72px;padding:40px 0;border-top:1px solid var(--report-divider)}
.bm-ch:first-of-type{border-top:0}
.bm-ch-heading{margin:0}
.bm-ch-hd{display:grid;width:100%;min-height:44px;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;margin:0 0 22px;padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.bm-ch-hd:hover .bm-ch-t{opacity:.75}
.bm-ch-num{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--report-ink-subtle)}
.bm-ch-t{color:var(--report-ink-strong);font-size:24px;font-weight:500;line-height:1.25;letter-spacing:-.01em;transition:opacity 120ms ease}
.bm-ch-toggle{color:var(--report-ink-subtle);font-family:var(--font-mono);font-size:14px;transition:transform 120ms ease}
.bm-ch.collapsed .bm-ch-toggle{transform:rotate(-90deg)}
.bm-ch.collapsed .bm-ch-body{display:none}
.bm-ch-body{min-width:0}
.bm-ch h3{max-width:780px;margin:32px 0 12px;color:var(--report-ink-strong);font-size:20px;font-weight:500;line-height:1.35;scroll-margin-top:72px}
.bm-ch h4{max-width:780px;margin:24px 0 10px;color:var(--report-ink-strong);font-size:16px;font-weight:500;line-height:1.45}
.bm-ch p{max-width:780px;margin:10px 0;color:var(--report-ink);font-size:16px;line-height:1.72}
.bm-ch ul,.bm-ch ol{max-width:780px;margin:12px 0;padding-left:24px;color:var(--report-ink);font-size:16px;line-height:1.72}
.bm-ch li{margin:6px 0}
.bm-ch strong{color:var(--report-ink-strong);font-weight:500}
.bm-ch code{padding:2px 6px;border-radius:4px;background:var(--report-surface);color:var(--report-ink-strong);font-family:var(--font-mono);font-size:13px}
.bm-ch pre{max-width:780px;margin:16px 0;padding:18px;border:1px solid var(--report-border);border-radius:var(--radius-8);overflow-x:auto;background:var(--report-surface);font-size:13px;line-height:1.65}
.bm-ch pre code{padding:0;background:transparent}
.bm-ch blockquote{max-width:780px;margin:16px 0;padding:14px 18px;border-left:2px solid var(--report-accent);background:var(--report-surface);color:var(--report-ink-muted);font-size:14px;line-height:1.65}
.table-scroll{width:100%;margin:16px 0;overflow-x:auto;border:1px solid var(--report-border);border-radius:var(--radius-8);-webkit-overflow-scrolling:touch}
.bm-ch table{width:100%;min-width:640px;border-collapse:separate;border-spacing:0;background:var(--report-bg);font-size:14px}
.bm-ch th{padding:12px 14px;border-bottom:1px solid var(--report-border);background:var(--report-surface);color:var(--report-ink-strong);font-size:13px;font-weight:500;text-align:left;vertical-align:bottom}
.bm-ch td{padding:12px 14px;border-bottom:1px solid var(--report-divider);color:var(--report-ink);line-height:1.58;vertical-align:top}
.bm-ch tr:last-child td{border-bottom:0}
.bm-ch tbody tr:hover td{background:var(--report-surface)}
.bm-ch hr{max-width:780px;margin:40px 0;border:0;border-top:1px solid var(--report-divider)}
.bm-ch a{overflow-wrap:anywhere}
.bm-alert,.ch-summary,.bm-callout{max-width:780px;margin:16px 0;padding:16px 18px;border-left:2px solid var(--report-accent);border-radius:0 var(--radius-8) var(--radius-8) 0;background:var(--report-surface);color:var(--report-ink);font-size:14px;line-height:1.68}
.bm-alert b,.ch-summary b,.bm-callout b{color:var(--report-ink-strong);font-weight:500}
.bm-callout.pink,.danger-banner{border:1px solid color-mix(in srgb,var(--report-risk) 25%,var(--report-bg));border-left:3px solid var(--report-risk);background:var(--report-risk-soft);color:var(--report-risk)}
.bm-callout.cream{border-left-color:var(--report-attention);background:var(--report-attention-soft);color:var(--report-attention)}
.danger-banner{max-width:780px;margin:16px 0;padding:16px 18px;border-radius:var(--radius-8);font-size:14px;line-height:1.68}
.danger-banner b{font-weight:500}
.quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:780px;margin:18px 0}
.quad-cell,.role-card{padding:18px;border:1px solid var(--report-border);border-radius:var(--radius-8);background:var(--report-bg);color:var(--report-ink);font-size:14px}
.quad-cell .qh,.role-card .rh{margin-bottom:10px;color:var(--report-ink-strong);font-size:14px;font-weight:500}
.role-tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:780px;margin:18px 0}
.role-card ul{margin:0;padding-left:20px;font-size:14px}
.role-card .ev{margin-top:12px;padding-top:12px;border-top:1px solid var(--report-divider);color:var(--report-ink-muted);font-size:12px}
.score-list{max-width:780px;margin:18px 0;padding:18px;border:1px solid var(--report-border);border-radius:var(--radius-8);background:var(--report-bg)}
.score-row{display:grid;grid-template-columns:140px 60px 1fr 100px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--report-divider);font-size:13px}
.score-row:last-of-type{border-bottom:0}
.score-row .sr-name{color:var(--report-ink-strong);font-weight:500}
.score-row .sr-weight,.score-row .sr-note{color:var(--report-ink-subtle);font-family:var(--font-mono);font-size:12px}
.score-track{height:6px;overflow:hidden;border-radius:var(--radius-pill);background:var(--report-divider)}
.score-fill{height:100%;border-radius:var(--radius-pill);background:var(--report-accent)}
.score-total{margin-top:12px;padding-top:12px;border-top:1px solid var(--report-border);color:var(--report-ink-strong);font-size:14px;font-weight:500;text-align:right}
.bm-q{max-width:780px;margin:12px 0;padding:16px 18px;border:1px solid var(--report-border);border-radius:var(--radius-8);background:var(--report-bg)}
.bm-q.fire{border-left:3px solid var(--report-risk)}
.bm-q.diamond{border-color:var(--report-border-strong)}
.bm-q-num{margin-bottom:6px;color:var(--report-ink-subtle);font-family:var(--font-mono);font-size:12px}
.bm-q-t{position:relative;width:100%;min-height:36px;padding:0 28px 0 0;border:0;background:transparent;color:var(--report-ink-strong);font-size:14px;font-weight:500;line-height:1.5;text-align:left;cursor:pointer}
.bm-q-t::after{content:'›';position:absolute;right:4px;top:50%;font-family:var(--font-mono);font-size:18px;color:var(--report-ink-subtle);transform:translateY(-50%) rotate(90deg);transition:transform 120ms ease}
.bm-q.collapsed .bm-q-t::after{transform:translateY(-50%)}
.bm-q.collapsed dl{display:none}
.bm-q dl{margin:12px 0 0;font-size:14px}
.bm-q dt{margin-top:12px;color:var(--report-ink-strong);font-size:12px;font-weight:500}
.bm-q dd{margin:4px 0 0;color:var(--report-ink);line-height:1.65}
.cnf,.est,.wrn,.evidence-tag{display:inline-flex;align-items:center;min-height:22px;margin:0 3px;padding:2px 7px;border-radius:var(--radius-6);background:var(--report-surface);color:var(--report-ink-muted);font-size:12px;font-weight:400;line-height:1.2}
.est{background:var(--report-attention-soft);color:var(--report-attention)}
.wrn{background:var(--report-risk-soft);color:var(--report-risk)}
.src{max-width:780px;margin:8px 0;color:var(--report-ink-subtle);font-size:12px;line-height:1.55}
.mermaid{max-width:780px;margin:18px 0;padding:18px;border:1px solid var(--report-border);border-radius:var(--radius-8);overflow-x:auto;background:var(--report-bg);text-align:center}
.mermaid svg{max-width:100%;height:auto}
footer{margin-top:48px;padding-top:24px;border-top:1px solid var(--report-divider);color:var(--report-ink-subtle);font-size:12px;text-align:left}
.vtag{display:block;margin-top:4px;font-family:var(--font-mono);font-size:12px}
@media(max-width:1023px){
  .report-layout{grid-template-columns:minmax(0,900px);max-width:964px;padding:24px 32px 80px}
  .report-nav{display:none}
  .metric-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric-card:nth-child(2){border-right:0}
  .metric-card:nth-child(-n+2){border-bottom:1px solid var(--report-divider)}
  .mobile-report-nav{position:sticky;top:0;z-index:30;display:flex;gap:8px;margin:0 -4px;padding:10px 4px;overflow-x:auto;border-bottom:1px solid var(--report-divider);background:var(--report-bg);scrollbar-width:none}
  .mobile-report-nav::-webkit-scrollbar{display:none}
  .mobile-report-nav a{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1px solid var(--report-border);border-radius:var(--radius-pill);color:var(--report-ink-muted);font-size:13px;white-space:nowrap;text-decoration:none}
  .mobile-report-nav a:hover{background:var(--report-surface);color:var(--report-ink-strong);opacity:1}
  .report-toolbar{position:static}
}
@media(max-width:720px){
  html,body{overflow-x:hidden}
  .report-layout{padding:16px 20px 64px}
  .report-cover{padding-top:18px}
  .report-title{font-size:30px}
  .view-nav{grid-template-columns:1fr}
  .role-tri{grid-template-columns:1fr}
  .score-row{grid-template-columns:1fr;gap:4px}
  .bm-ch{padding:32px 0;scroll-margin-top:68px}
  .bm-ch-t{font-size:22px}
  .bm-ch h3{font-size:20px}
  .table-scroll{max-width:calc(100vw - 40px)}
}
@media(max-width:479px){
  .report-layout{padding:12px 16px 56px}
  .report-title{font-size:28px}
  .metric-strip{grid-template-columns:1fr}
  .metric-card{border-right:0;border-bottom:1px solid var(--report-divider)}
  .metric-card:last-child{border-bottom:0}
  .report-toolbar{justify-content:flex-start;overflow-x:auto}
  .toolbar-btn{flex:0 0 auto}
  .quad{grid-template-columns:1fr}
  .table-scroll{max-width:calc(100vw - 32px)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
@media print{
  @page{size:A4;margin:16mm}
  body{font-size:11pt;color:var(--report-ink);background:var(--report-bg)}
  .skip-link,.report-nav,.mobile-report-nav,.report-toolbar,.view-nav-wrap{display:none!important}
  .report-layout{display:block;max-width:none;padding:0}
  .report-cover{padding-top:0}
  .bm-ch{break-inside:auto;padding:24px 0;scroll-margin:0}
  .bm-ch-body,.bm-ch.collapsed .bm-ch-body{display:block!important}
  .bm-ch-toggle{display:none}
  .table-scroll{overflow:visible;border-color:var(--report-border)}
  .bm-ch table{min-width:0;font-size:9pt}
  .bm-ch tr{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}
</style>

(function(){
  var root=document.documentElement;
  var mermaidSources=[];
  var mermaidRenderRun=0;
  async function renderAllMermaid(){

  document.getElementById('toc-content').innerHTML=tocHtml;

  var mobileNav=document.getElementById('mobile-report-nav');
  mobileNav.innerHTML=tocGroups.map(function(group){var sec=sections.find(function(item){return item.dataset.sectionGroup===group.key;});return sec?'<a href="#'+sec.id+'">'+escHtml(group.label)+'</a>':'';}).join('');

  function updateViewCard(kind,defaultText){
    var panels=sections.filter(function(sec){return sec.getAttribute('data-view-panel')===kind;});
    var link=document.querySelector('[data-view-link="'+kind+'"]');
    if(!panels.length){link.hidden=true;return;}
    link.setAttribute('href','#'+panels[0].id);
    var details=[];
    panels.forEach(function(panel){var sub=Array.prototype.slice.call(panel.querySelectorAll('h3')).map(function(h){return cleanTitle(h.textContent);});if(sub.length){details=details.concat(sub);}else{details.push(cleanTitle(panel.querySelector('.bm-ch-t').textContent));}});
    var desc=document.getElementById(kind+'-view-desc');
    desc.textContent=details.slice(0,4).join(' · ')||defaultText;
  }
  updateViewCard('business','产品、客户、商业模式、竞争与增长约束');
  updateViewCard('technology','能力、研发证据、成熟度、自研边界与依赖');

  var sourceIds={};
  contentEl.querySelectorAll('tr').forEach(function(row){
    var cell=row.querySelector('td');if(!cell)return;
    var match=cell.textContent.trim().match(/^\[(S\d{2,})\]$/i);if(!match)return;
    var id=match[1].toUpperCase();row.id='source-'+id.toLowerCase();sourceIds[id]=row.id;cell.innerHTML='<span class="evidence-tag">['+id+']</span>';
  });
  var sourceCount=document.getElementById('source-count');
  var sourceTotal=Object.keys(sourceIds).length;sourceCount.textContent=sourceTotal?sourceTotal+' 个公开来源':'来源见正文';
  var textNodes=[];var walker=document.createTreeWalker(contentEl,NodeFilter.SHOW_TEXT,{acceptNode:function(node){
    if(!/\[S\d{2,}\]/i.test(node.nodeValue||''))return NodeFilter.FILTER_REJECT;
    var parent=node.parentElement;if(!parent||parent.closest('a,code,pre,tr[id^="source-"]'))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  while(walker.nextNode())textNodes.push(walker.currentNode);
  textNodes.forEach(function(node){
    var parts=node.nodeValue.split(/(\[S\d{2,}\])/ig);var fragment=document.createDocumentFragment();
    parts.forEach(function(part){var m=part.match(/^\[(S\d{2,})\]$/i);var id=m&&m[1].toUpperCase();if(id&&sourceIds[id]){var a=document.createElement('a');a.className='evidence-tag';a.href='#'+sourceIds[id];a.textContent='['+id+']';fragment.appendChild(a);}else{fragment.appendChild(document.createTextNode(part));}});
    node.parentNode.replaceChild(fragment,node);
  });

  document.getElementById('expand-all').addEventListener('click',function(){sections.forEach(function(sec){setSectionCollapsed(sec,false);});});
  document.getElementById('collapse-all').addEventListener('click',function(){sections.forEach(function(sec){setSectionCollapsed(sec,true);});});
  var printState=[];
  window.addEventListener('beforeprint',function(){printState=sections.map(function(sec){return sec.classList.contains('collapsed');});sections.forEach(function(sec){setSectionCollapsed(sec,false);});});
  window.addEventListener('afterprint',function(){sections.forEach(function(sec,index){setSectionCollapsed(sec,Boolean(printState[index]));});});
  document.getElementById('print-report').addEventListener('click',function(){window.print();});
  document.querySelectorAll('a[href^="#"]').forEach(function(link){link.addEventListener('click',function(){var target=document.querySelector(link.getAttribute('href'));var section=target&&target.closest('.bm-ch');if(section)setSectionCollapsed(section,false);});});

  // Mermaid 启动：先保存原始源码，再逐图显式 parse/render。
  contentEl.querySelectorAll('.mermaid').forEach(function(block,i){
    mermaidSources[i]=block.textContent.trim();
    block.dataset.diagramIndex=String(i+1);
  });
  renderAllMermaid();

  // scrollspy
  var tocLinks=document.querySelectorAll('.bm-toc a,.mobile-report-nav a');
  var observer=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        tocLinks.forEach(function(link){link.classList.remove('active');link.removeAttribute('aria-current');});
        document.querySelectorAll('a[href="#'+en.target.id+'"]').forEach(function(link){link.classList.add('active');link.setAttribute('aria-current','location');});
      }
    });
  },{rootMargin:'-80px 0px -70% 0px'});
  contentEl.querySelectorAll('.bm-ch, h3').forEach(function(el){if(el.id)observer.observe(el);});

})();
</script>

</body>
</html>
