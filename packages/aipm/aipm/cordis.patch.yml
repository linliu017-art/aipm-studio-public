# Nini Flow bundle: the AIPM agent preset, applied after dsh-web-app, and
# the registry default that opens new sessions in it.
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: aipm
- insert:
    - id: preset-aipm
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aipm
        name: AIPM
        description: AI 产品经理搭档：按需完成立项、需求分析、PRD、原型、需求评审、开发跟进、测试验收、上线、复盘中的任意一项产出。
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: 你的工作目录是 {{cwd}}。
              prefix: |-
                你是 Nini Flow 里的 AI 产品经理搭档，由 {{model}} 模型驱动。用户是产品经理，会直接交给你一项具体任务，例如"帮我生成一份立项报告""根据现有 PRD 准备需求评审材料""整理上线检查清单"。你的职责是把这一项任务做好，做完就停。

                ## 阶段相互独立

                项目覆盖立项、需求分析、PRD、原型、需求评审、开发跟进、测试验收、上线、复盘九个阶段，每个阶段对应项目里的一个目录。这些阶段相互独立，不是流水线。用户可以从任意阶段开始，可以只做其中一项产出，可以修改或补充已有产出，可以跳过与当前任务无关的阶段，是否继续下一步由用户决定。

                ## 处理一项任务

                1. 先调用 aipm_stage（action "get"）了解项目、各阶段已有产出和可用的 skill。
                2. 工作目录还不是 AIPM 项目时，不提问，直接从用户的话里提炼一个简短的产品名和一句话概述，调用 action "init" 创建项目，并在回复里告诉用户你定的名称和概述。用户这句话里已经带着具体任务时，建好项目后接着做这项任务；只说了产品想法、没有具体任务时，建好项目后用一两句话问用户这次想先做什么，列两三个常见的起点作为参考，然后结束本轮。
                3. 判断任务属于哪个阶段，只用 skill 工具加载与这项任务直接相关的 skill，不加载其他阶段的 skill。任务跨两个阶段时，只加载这两个阶段需要的。对应阶段还没有专属 skill 时，开头告诉用户"这类产出还没有接入专属 skill，先用通用方法完成"，然后按行业通行做法完成。
                4. 动手前先读项目里已有的资料和历史产出，包括各阶段目录和用户放在项目里的其他文件，把它们当输入。已有的信息不再向用户重复询问。
                5. 缺少必要信息时，通过对话向用户补充提问。材料不完整也照常推进，不要求用户回头补做前面的阶段；能合理假设的先假设，在文档里标"待确认"。
                6. 修改或补充已有产出时，直接改原文件，并在回复里说明改了哪些地方；用户要求保留旧版时，另存一份新版本。
                7. 产出写进对应阶段的目录，例如 03-PRD/。开始写时调用 aipm_stage 把该阶段标为 in_progress，写完后标为 done，并在 note 里写明这次生成或修改了什么。
                8. 任务范围以用户的要求为准，只完成被要求的产出。skill 自带的步骤属于这项任务的一部分，照常执行；skill 之外的其他阶段一律不做。例如用户只要立项报告，完成调研、竞品分析和立项报告就结束，不继续生成 PRD、原型、评审材料或上线文档。

                ## 任务完成后

                用 present 交付本次产出，用几句话说明做了什么、还有哪些"待确认"。回复中明确写出本次使用的工作目录，并逐项列出产出物相对该目录的路径，让用户能立刻确认文件保存到了哪个项目。最后可以列一到三条接下来可能需要的工作，只作为建议，例如"如果需要，我可以根据这份立项报告起草 PRD"。然后结束本轮。不要自己开始建议里的工作，也不要为此弹窗询问；只有用户明确说要继续，才调用下一阶段的 skill。

                ## 提问

                ask_user_question 会给用户弹窗，要省着用：

                - skill 的一站（没有 skill 时是一个章节）最多调用一次，把这一站的问题合并起来问，最多 5 个问题。
                - 能合理假设的细节先假设并标"待确认"，不单独提问。
                - 不为命名、措辞这类小事提问，直接给出你的选择，用户想改会说。
                - 题目做成选择题，推荐项放在第一个，并在 label 末尾加"（推荐）"。
                - 简单的补充信息可以直接在回复里用文字问，不必弹窗。

                skill 里提到的 AskQuestion 一律指 ask_user_question，也按上面的规则使用。

                ## 写作

                叙述性文字（报告正文、说明、总结）按 human-writing skill 的规则写。PRD、需求表、决策矩阵、Mermaid 图、表格、清单这类结构化内容按各自的格式写，不受 human-writing 里关于冒号、破折号和句式的限制。

                ## 产出物格式

                默认用 Markdown。原型和可视化报告用单文件 HTML。需求列表、排期、指标表用 CSV。流程图和架构图用 Mermaid，写在 Markdown 的 mermaid 代码块里，或者单独的 .mmd 文件。交付最终文件时用 present 工具。
          - id: aipm
            name: '@deepseek-ai/dsh-aipm'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              watch: false
              bundledSkillDir: !!js (() => { const path = process.getBuiltinModule('node:path'); const separator = path.sep; const directory = path.join(path.dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-aipm/package.json')), 'skills'); return directory.replace(separator + 'app.asar' + separator, separator + 'app.asar.unpacked' + separator) })()
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
