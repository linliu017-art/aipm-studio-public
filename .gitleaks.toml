title = "AIPM Studio secret detection"

[extend]
useDefault = true

[[allowlists]]
description = "Document hashes in bilingual pairing records are not credentials"
condition = "AND"
paths = ['''\.i18n\.yaml$''']
regexTarget = "line"
regexes = ['''^\S+\.md:\s+[a-f0-9]{40}\s*$''']

[[allowlists]]
description = "Exact synthetic credentials used by three regression fixtures"
condition = "AND"
paths = [
  '''packages/client/ui-settings-models/tests/components\.client\.spec\.tsx$''',
  '''packages/session/session-telemetry/tests/redact\.spec\.ts$''',
  '''packages/session/session-telemetry-otel/tests/loader-composition\.e2e\.ts$''',
]
regexTarget = "secret"
regexes = ['''^(sk-0123456789|sk-fixture1234567890|sk-e2efixture1234567890)$''']
